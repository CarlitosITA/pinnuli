# Esempio di virtual host da AGGIUNGERE come file nuovo (nessun file esistente va toccato).
# Dopo averlo copiato:  nginx -t && systemctl reload nginx
# Il certificato va richiesto con lo stesso strumento già usato sulla VPS (es. certbot --nginx -d app.pinnuli.it).
server {
    listen 80;
    server_name app.pinnuli.it;

    location / {
        proxy_pass http://127.0.0.1:38100;   # stessa porta di PINNULI_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gli aggiornamenti in tempo reale (SSE) non devono essere messi in coda né interrotti.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
