name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pinnuli
          POSTGRES_PASSWORD: pinnuli
          POSTGRES_DB: pinnuli_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pinnuli" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pinnuli:pinnuli@localhost:5432/pinnuli_test
      TEST_DATABASE_URL: postgres://pinnuli:pinnuli@localhost:5432/pinnuli_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SESSION_SECRET: solo-per-la-compilazione-solo-per-la-compilazione

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pinnuli
          POSTGRES_PASSWORD: pinnuli
          POSTGRES_DB: pinnuli_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pinnuli" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pinnuli:pinnuli@localhost:5432/pinnuli_e2e
      SESSION_SECRET: prova-end-to-end-prova-end-to-end-prova
      ADMIN_EMAIL: giovanni@example.com
      ADMIN_PASSWORD: password-di-prova
      APP_URL: http://localhost:3000
      SEED_THERAPY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npm run start &
      - run: npx wait-on http-get://localhost:3000/api/health --timeout 60000
      - run: npm run e2e -w @pinnuli/web

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile --target web -t pinnuli-web:ci .
      - run: docker build -f deploy/Dockerfile --target worker -t pinnuli-worker:ci .

  # Pubblica le immagini su GitHub Container Registry (solo da main o a mano). La VPS le scarica soltanto.
  publish:
    runs-on: ubuntu-latest
    needs: [test, e2e, docker]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for target in web worker; do
            docker build -f deploy/Dockerfile --target $target -t ghcr.io/$OWNER/pinnuli-$target:latest -t ghcr.io/$OWNER/pinnuli-$target:${{ github.sha }} .
            docker push --all-tags ghcr.io/$OWNER/pinnuli-$target
          done
